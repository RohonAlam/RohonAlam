# ============================================================
# .github/workflows/github-streak.yml
#
# Runs daily at 12:15 AM IST
#
# Generates:
#   assets/github-streak.svg
# ============================================================

name: Update GitHub Streak Card

on:
  schedule:
    # 18:45 UTC = 12:15 AM IST (next day)
    - cron: "45 18 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-card:
    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ======================================================
      # NODE SETUP
      # ======================================================

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"


      # ======================================================
      # GENERATE GITHUB STREAK
      # ======================================================

      - name: Generate GitHub streak card
        env:
          GITHUB_USERNAME: RohonAlam
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TZ: Asia/Kolkata

        run: |
          node scripts/generate-github-streak.mjs


      # ======================================================
      # VERIFY
      # ======================================================

      - name: Verify GitHub streak card
        run: |
          test -f assets/github-streak.svg
          ls -lah assets/github-streak.svg


      # ======================================================
      # COMMIT
      # ======================================================

      - name: Commit updated card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/github-streak.svg

          if git diff --cached --quiet; then
            echo "No GitHub streak changes."
            exit 0
          fi

          git commit -m "chore: update GitHub streak card"

          git pull --rebase origin main
          git push origin main
