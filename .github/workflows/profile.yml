name: GitHub Profile Automation

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  profile-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GitHub Snake
        uses: github-profile-3d-contrib/github-profile-3d-contrib@v1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate trophies
        uses: Platane/snk@v3
        with:
          github_user_name: RohonAlam
          outputs: >-
            profile-3d-contrib/profile-gitcon.svg
            profile-3d-contrib/profile-snake.svg
            profile-3d-contrib/profile-trophy.svg

      - name: Upload generated artifacts
        uses: actions/upload-artifact@v4
        with:
          name: generated-profile-assets
          path: profile-3d-contrib/
