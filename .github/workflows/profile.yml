# ============================================================
# .github/workflows/profile.yml
#
# Runs daily at 12:05 AM IST
#
# Generates:
#   - GitHub contribution snake
#   - LeetCode heatmap
#   - GitHub trophies
# ============================================================

name: Generate AI OS Profile Assets

on:
  schedule:
    # 18:35 UTC = 12:05 AM IST (next day)
    - cron: "35 18 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-profile-assets:
    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ======================================================
      # CREATE DIRECTORIES
      # ======================================================

      - name: Create directories
        run: |
          mkdir -p profile
          mkdir -p scripts


      # ======================================================
      # GITHUB SNAKE
      # ======================================================

      - name: Generate GitHub snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: RohonAlam
          outputs: |
            profile/snake.svg?color_snake=%2339D9FF&color_dots=%23161B22,%230E7490,%230891B2,%2322D3EE,%2367E8F9
            profile/snake-dark.svg?palette=github-dark&color_snake=%2339D9FF&color_dots=%23161B22,%230E7490,%230891B2,%2322D3EE,%2367E8F9


      # ======================================================
      # PYTHON SETUP
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ======================================================
      # CHECK LEETCODE HEATMAP SCRIPT
      # ======================================================

      - name: Check LeetCode heatmap script
        run: |
          if [ ! -f scripts/generate_leetcode_heatmap.py ]; then
            echo "ERROR: scripts/generate_leetcode_heatmap.py not found"
            exit 1
          fi


      # ======================================================
      # LEETCODE HEATMAP
      # ======================================================

      - name: Generate LeetCode heatmap
        run: |
          python scripts/generate_leetcode_heatmap.py


      # ======================================================
      # GITHUB TROPHIES
      # ======================================================

      - name: Generate GitHub trophies
        uses: Erik-Donath/github-profile-trophy@feature/generate-svg
        with:
          username: RohonAlam
          token: ${{ secrets.METRICS_TOKEN }}
          file: profile/trophies.svg
          theme: onedark
          max-cols: 4
          margin-width: 12
          margin-height: 12


      # ======================================================
      # VERIFY GENERATED FILES
      # ======================================================

      - name: Verify generated assets
        run: |
          echo "========================================"
          echo "Generated profile assets"
          echo "========================================"

          ls -lah profile/

          test -f profile/snake.svg
          test -f profile/snake-dark.svg
          test -f profile/leetcode-heatmap.svg
          test -f profile/trophies.svg

          echo "========================================"
          echo "All profile assets generated successfully"
          echo "========================================"


      # ======================================================
      # COMMIT GENERATED FILES
      # ======================================================

      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: update profile assets"

          git pull --rebase origin main
          git push origin main
