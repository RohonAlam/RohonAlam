# ==============================================================================
# .github/workflows/profile.yml
#
# Regenerates the two assets that CANNOT be served as a live third-party <img>
# URL: the contribution "snake" animation and the trophies SVG. Everything
# else in README.md (GitHub Stats, Streak, Activity Graph, LeetCode) is a live
# embed pointed at a rendering service, so it needs no workflow.
#
# NOTE ON VERIFICATION: I have not run this workflow and cannot confirm these
# action versions/inputs are current as of today — GitHub Action APIs change.
# Before relying on this, open each action's README on its repo and confirm
# the `uses:` tag and `with:` inputs still match. The two actions below are
# real, commonly-used community actions (Platane/snk for the snake, and the
# github-profile-trophy generator for trophies), not invented ones — but
# their exact current syntax should still be verified against the source.
# ==============================================================================

name: Generate AI OS Profile Assets

on:
  schedule:
    - cron: "0 0 * * *"   # once a day, midnight UTC
  push:
    branches:
      - main
  workflow_dispatch: {}     # allow manual runs from the Actions tab

