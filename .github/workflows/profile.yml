  generate-contribution-graphs:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: mkdir -p profile

      # -----------------------------
      # GitHub Snake
      # -----------------------------

      - name: Generate GitHub snake
        uses: Platane/snk@v3
        with:
          github_user_name: RohonAlam
          outputs: |
            profile/snake.svg?color_snake=%2339D9FF&color_dots=%23161B22,%230E7490,%230891B2,%2322D3EE,%2367E8F9
            profile/snake-dark.svg?palette=github-dark&color_snake=%2339D9FF&color_dots=%23161B22,%230E7490,%230891B2,%2322D3EE,%2367E8F9

      # -----------------------------
      # LeetCode Heatmap
      # -----------------------------

      - name: Generate LeetCode heatmap
        run: python scripts/generate_leetcode_heatmap.py

      # -----------------------------
      # Commit everything
      # -----------------------------

      - name: Commit generated graphs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          git add profile/

          git diff --cached --quiet || (
            git commit -m "Update contribution graphs"
            git push
          )

  generate-trophies:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate trophies SVG
        uses: ryo-ma/github-profile-trophy@v1
        with:
          username: RohonAlam
          theme: onedark
          column: 4
          margin-w: 12
          margin-h: 12
          no-frame: true
          no-bg: false
          output: profile/trophies.svg

      - name: Commit updated trophies asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/trophies.svg
          git diff --staged --quiet || git commit -m "chore: refresh trophies.svg [automated]"
          git push
