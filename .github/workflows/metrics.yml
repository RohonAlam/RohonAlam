name: GitHub Metrics

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          user: RohonAlam

          filename: profile/github-metrics.svg

          base: header, activity, community, repositories, metadata

          config_timezone: Asia/Kolkata

          config_display: large

          config_padding: 10

          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_details: percentage

          plugin_isocalendar: yes

          plugin_achievements: yes
          plugin_achievements_display: compact

          plugin_lines: yes

          plugin_followup: yes

          plugin_topics: yes
          plugin_topics_limit: 12

          plugin_stars: yes
  trophies:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create profile folder
        run: mkdir -p profile

      - name: Generate trophies
        uses: Erik-Donath/github-profile-trophy@feature/generate-svg
        with:
          username: RohonAlam
          file: profile/trophies.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit trophies
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/trophies.svg

          git diff --quiet && git diff --staged --quiet || (
            git commit -m "Update trophies"
            git push
          )

