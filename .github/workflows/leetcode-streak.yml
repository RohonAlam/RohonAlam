name: Update LeetCode Streak Card

on:
  schedule:
    # Runs once a day at 00:30 UTC. Adjust as you like.
    - cron: "30 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate LeetCode streak card
        env:
          LEETCODE_USERNAME: rohon97
        run: node scripts/generate-leetcode-streak.mjs

      - name: Commit updated card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/leetcode-streak.svg
          git diff --staged --quiet || git commit -m "chore: update LeetCode streak card"
          git push
