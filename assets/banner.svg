<!--
  banner.svg
  Premium sci-fi banner with a hexagonal HUD, radar ring, and progress diagnostics.
  Group naming convention:
    - background
    - grid
    - hud
    - text
    - accent
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" role="img" aria-labelledby="title desc">
  <title id="title">AI OS Banner</title>
  <desc id="desc">Futuristic banner with hexagonal background, HUD lines, radar, and system ready heading.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071018" />
      <stop offset="100%" stop-color="#0D1117" />
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00FFFF" />
      <stop offset="100%" stop-color="#00A3FF" />
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <g id="background">
    <rect width="1600" height="600" fill="url(#bg)"/>
    <rect x="12" y="12" width="1576" height="576" rx="18" fill="none" stroke="#00FFFF" stroke-opacity="0.18"/>
    <g opacity="0.18" stroke="#00A3FF">
      <path d="M0 120H1600" />
      <path d="M0 240H1600" />
      <path d="M0 360H1600" />
      <path d="M0 480H1600" />
      <path d="M120 0V600" />
      <path d="M320 0V600" />
      <path d="M520 0V600" />
      <path d="M720 0V600" />
      <path d="M920 0V600" />
      <path d="M1120 0V600" />
      <path d="M1320 0V600" />
    </g>
  </g>

  <g id="grid">
    <polygon points="160,150 320,80 480,150 480,290 320,360 160,290" fill="none" stroke="#00FFFF" stroke-opacity="0.4" stroke-width="2"/>
    <polygon points="320,80 480,150 480,290 320,360 160,290 160,150" fill="none" stroke="#00A3FF" stroke-opacity="0.25"/>
    <path d="M160 150H480" stroke="#00FFFF" stroke-opacity="0.15"/>
    <path d="M320 80V360" stroke="#00FFFF" stroke-opacity="0.15"/>
  </g>

  <g id="hud">
    <rect x="720" y="55" width="820" height="500" rx="12" fill="none" stroke="#00FFFF" stroke-opacity="0.38"/>
    <rect x="755" y="90" width="750" height="148" rx="8" fill="#0D1117" stroke="#00A3FF" opacity="0.7"/>
    <rect x="755" y="260" width="750" height="250" rx="8" fill="#0D1117" stroke="#00A3FF" opacity="0.7"/>
    <path d="M760 140H1460" stroke="url(#cyan)" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <path d="M760 310H1460" stroke="url(#cyan)" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
    <rect x="850" y="135" width="440" height="12" rx="6" fill="#00FFFF" opacity="0.8" filter="url(#glow)"/>
    <rect x="850" y="168" width="280" height="8" rx="4" fill="#00A3FF" opacity="0.6"/>
    <circle cx="1225" cy="170" r="26" fill="none" stroke="#00FFFF" stroke-width="4" opacity="0.8"/>
    <circle cx="1225" cy="170" r="10" fill="#00FFFF"/>
    <path d="M1250 155l80 15" stroke="#00FFFF" stroke-opacity="0.8"/>
    <path d="M1250 185l100 30" stroke="#00A3FF" stroke-opacity="0.7"/>
  </g>

  <g id="radar">
    <circle cx="320" cy="220" r="92" fill="none" stroke="#00FFFF" stroke-opacity="0.35"/>
    <circle cx="320" cy="220" r="66" fill="none" stroke="#00FFFF" stroke-opacity="0.28"/>
    <circle cx="320" cy="220" r="42" fill="none" stroke="#00FFFF" stroke-opacity="0.25"/>
    <path d="M320 220L402 138" stroke="#00FFFF" stroke-opacity="0.55"/>
    <path d="M320 220L380 300" stroke="#00A3FF" stroke-opacity="0.4"/>
    <path d="M320 220L237 140" stroke="#00A3FF" stroke-opacity="0.3"/>
    <path d="M320 220L250 305" stroke="#00FFFF" stroke-opacity="0.36"/>
    <circle cx="320" cy="220" r="12" fill="#00FF88" opacity="0.85" filter="url(#glow)"/>
  </g>

  <g id="text">
    <text x="760" y="120" fill="#00FFFF" font-family="JetBrains Mono, Fira Code, monospace" font-size="28" letter-spacing="3">AI OPERATING SYSTEM</text>
    <text x="760" y="215" fill="#FFFFFF" font-family="JetBrains Mono, Fira Code, monospace" font-size="64" font-weight="700">SYSTEM READY</text>
    <text x="760" y="272" fill="#8B949E" font-family="JetBrains Mono, Fira Code, monospace" font-size="22">Research Workstation / Neural Command Center</text>
    <text x="760" y="350" fill="#00FFFF" font-family="JetBrains Mono, Fira Code, monospace" font-size="24">BOOT SEQUENCE</text>
    <text x="760" y="390" fill="#FFFFFF" font-family="JetBrains Mono, Fira Code, monospace" font-size="20">Computer Vision Engine · Robotics Runtime · Deep Learning Runtime</text>
    <text x="760" y="425" fill="#FFFFFF" font-family="JetBrains Mono, Fira Code, monospace" font-size="20">Neural Rendering · Research Database · GitHub API</text>
    <text x="760" y="460" fill="#00FF88" font-family="JetBrains Mono, Fira Code, monospace" font-size="22">✓ Live diagnostics connected</text>
  </g>

  <g id="accent">
    <rect x="920" y="480" width="500" height="14" rx="7" fill="#00FFFF" opacity="0.12"/>
    <rect x="920" y="480" width="360" height="14" rx="7" fill="#00FFFF" filter="url(#glow)"/>
    <text x="920" y="525" fill="#8B949E" font-family="JetBrains Mono, Fira Code, monospace" font-size="16">CORE_LOAD 87% · GPU_READY · LINK_ACTIVE</text>
  </g>
</svg>
