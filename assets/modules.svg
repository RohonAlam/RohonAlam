<!--
  modules.svg
  Diagnostic module overview panel for AI system modules.
  Groups: background, title, bars, text.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Module Diagnostics</title>
  <desc id="desc">Structured AI module diagnostics with progress bars.</desc>
  <g id="background">
    <rect width="1200" height="500" fill="#0D1117" />
    <rect x="20" y="20" width="1160" height="460" rx="14" fill="none" stroke="#00FFFF" stroke-opacity="0.32" />
  </g>
  <g id="title">
    <text x="60" y="80" fill="#00FFFF" font-family="JetBrains Mono, Fira Code, monospace" font-size="28">ACTIVE MODULES</text>
  </g>
  <g id="bars">
    <text x="60" y="150" fill="#FFFFFF" font-family="JetBrains Mono, Fira Code, monospace" font-size="20">Computer Vision</text>
    <rect x="360" y="132" width="700" height="18" rx="9" fill="#0A121A" stroke="#00FFFF" stroke-opacity="0.35" />
    <rect x="360" y="132" width="644" height="18" rx="9" fill="#00FFFF" />

    <text x="60" y="220" fill="#FFFFFF" font-family="JetBrains Mono, Fira Code, monospace" font-size="20">Robotics</text>
    <rect x="360" y="202" width="700" height="18" rx="9" fill="#0A121A" stroke="#00FFFF" stroke-opacity="0.35" />
    <rect x="360" y="202" width="602" height="18" rx="9" fill="#00A3FF" />

    <text x="60" y="290" fill="#FFFFFF" font-family="JetBrains Mono, Fira Code, monospace" font-size="20">SLAM</text>
    <rect x="360" y="272" width="700" height="18" rx="9" fill="#0A121A" stroke="#00FFFF" stroke-opacity="0.35" />
    <rect x="360" y="272" width="546" height="18" rx="9" fill="#00FFFF" />

    <text x="60" y="360" fill="#FFFFFF" font-family="JetBrains Mono, Fira Code, monospace" font-size="20">Neural Rendering</text>
    <rect x="360" y="342" width="700" height="18" rx="9" fill="#0A121A" stroke="#00FFFF" stroke-opacity="0.35" />
    <rect x="360" y="342" width="560" height="18" rx="9" fill="#00FF88" />
  </g>
</svg>
