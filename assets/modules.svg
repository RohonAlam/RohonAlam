<svg width="900" height="260" viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg">
  <!-- ============================================================
       modules.svg — ACTIVE MODULES progress bars (Section 4)
       Percentages mirror assets/config.md → MODULES table.
       Update <rect class="fill"> widths (max 500) to change values.
       ============================================================ -->
  <g id="background">
    <rect x="0" y="0" width="900" height="260" rx="10" fill="#0D1117" stroke="#00A3FF" stroke-opacity="0.35"/>
  </g>
  <g id="text" font-family="JetBrains Mono, monospace" font-size="13">
    <text x="30" y="34" fill="#00FFFF" font-size="15" font-weight="bold">ACTIVE MODULES</text>

    <!-- Computer Vision 90% -->
    <text x="30" y="66" fill="#FFFFFF">Computer Vision</text>
    <rect x="260" y="54" width="500" height="14" rx="4" fill="#161B22"/>
    <rect x="260" y="54" width="450" height="14" rx="4" fill="#00FFFF"/>
    <text x="772" y="66" fill="#8B949E">90%</text>

    <!-- Robotics 85% -->
    <text x="30" y="98" fill="#FFFFFF">Robotics</text>
    <rect x="260" y="86" width="500" height="14" rx="4" fill="#161B22"/>
    <rect x="260" y="86" width="425" height="14" rx="4" fill="#00FFFF"/>
    <text x="772" y="98" fill="#8B949E">85%</text>

    <!-- SLAM 75% -->
    <text x="30" y="130" fill="#FFFFFF">SLAM</text>
    <rect x="260" y="118" width="500" height="14" rx="4" fill="#161B22"/>
    <rect x="260" y="118" width="375" height="14" rx="4" fill="#00A3FF"/>
    <text x="772" y="130" fill="#8B949E">75%</text>

    <!-- NeRF 60% -->
    <text x="30" y="162" fill="#FFFFFF">NeRF</text>
    <rect x="260" y="150" width="500" height="14" rx="4" fill="#161B22"/>
    <rect x="260" y="150" width="300" height="14" rx="4" fill="#00A3FF"/>
    <text x="772" y="162" fill="#8B949E">60%</text>

    <!-- Gaussian Splatting 50% -->
    <text x="30" y="194" fill="#FFFFFF">Gaussian Splatting</text>
    <rect x="260" y="182" width="500" height="14" rx="4" fill="#161B22"/>
    <rect x="260" y="182" width="250" height="14" rx="4" fill="#00A3FF"/>
    <text x="772" y="194" fill="#8B949E">50%</text>

    <!-- Neural Rendering 70% -->
    <text x="30" y="226" fill="#FFFFFF">Neural Rendering</text>
    <rect x="260" y="214" width="500" height="14" rx="4" fill="#161B22"/>
    <rect x="260" y="214" width="350" height="14" rx="4" fill="#00FFFF"/>
    <text x="772" y="226" fill="#8B949E">70%</text>
  </g>
</svg>
