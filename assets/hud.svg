<!--
  hud.svg
  Generic HUD frame with borders, scan lines, and corners.
  Groups: background, frame, grid, accent.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">HUD Frame</title>
  <desc id="desc">Futuristic HUD border with corners and diagnostic line work.</desc>
  <g id="background">
    <rect width="1200" height="600" fill="#0D1117" />
    <rect x="12" y="12" width="1176" height="576" rx="18" fill="none" stroke="#00FFFF" stroke-opacity="0.28" />
  </g>
  <g id="grid">
    <path d="M60 60H1140" stroke="#00FFFF" stroke-opacity="0.16" />
    <path d="M60 540H1140" stroke="#00FFFF" stroke-opacity="0.16" />
    <path d="M60 60V540" stroke="#00FFFF" stroke-opacity="0.16" />
    <path d="M1140 60V540" stroke="#00FFFF" stroke-opacity="0.16" />
  </g>
  <g id="frame">
    <path d="M85 85H250V110H150V250H85V85Z" fill="none" stroke="#00FFFF" stroke-width="3"/>
    <path d="M1115 85H950V110H1050V250H1115V85Z" fill="none" stroke="#00FFFF" stroke-width="3"/>
    <path d="M85 515H250V490H150V350H85V515Z" fill="none" stroke="#00FFFF" stroke-width="3"/>
    <path d="M1115 515H950V490H1050V350H1115V515Z" fill="none" stroke="#00FFFF" stroke-width="3"/>
    <path d="M600 60V540" stroke="#00FFFF" stroke-opacity="0.15" />
    <path d="M60 300H1140" stroke="#00FFFF" stroke-opacity="0.15" />
  </g>
  <g id="accent">
    <rect x="120" y="120" width="450" height="10" rx="5" fill="#00FFFF" opacity="0.45" />
    <rect x="120" y="470" width="450" height="10" rx="5" fill="#00FFFF" opacity="0.45" />
    <rect x="730" y="120" width="350" height="10" rx="5" fill="#00A3FF" opacity="0.45" />
    <rect x="730" y="470" width="350" height="10" rx="5" fill="#00A3FF" opacity="0.45" />
  </g>
</svg>
