    <path d="M390 158L426 132" stroke="#00FFFF" stroke-width="6" />
    <path d="M390 354L426 380" stroke="#00FFFF" stroke-width="6" />
    <path d="M256 428V464" stroke="#00FFFF" stroke-width="6" />
