
<svg
  width="495"
  height="195"
  viewBox="0 0 495 195"
  xmlns="http://www.w3.org/2000/svg"
  font-family="'Segoe UI', Ubuntu, Sans-Serif"
>

<style>

  .bg {
    fill: #0d1117;
    stroke: #2a2f3a;
    stroke-width: 1;
  }

  .divider {
    stroke: #2a2f3a;
    stroke-width: 1;
  }

  .big-num {
    font-size: 30px;
    font-weight: 700;
  }

  .num-blue {
    fill: #58a6ff;
  }

  .label {
    font-size: 12px;
    fill: #ffffff;
    font-weight: 600;
  }

  .sub {
    font-size: 10px;
    fill: #7d8590;
  }

  .streak-label {
    font-size: 12px;
    fill: #39d9d9;
    font-weight: 700;
  }

  .ring {
    fill: none;
    stroke: #39d9d9;
    stroke-width: 5;
  }

  .streak-num {
    font-size: 25px;
    font-weight: 700;
    fill: #ffffff;
  }

</style>


<!-- ====================================================== -->
<!-- Background -->
<!-- ====================================================== -->

<rect
  x="1"
  y="1"
  width="493"
  height="193"
  rx="10"
  class="bg"
/>


<!-- ====================================================== -->
<!-- Dividers -->
<!-- ====================================================== -->

<line
  x1="165"
  y1="27"
  x2="165"
  y2="168"
  class="divider"
/>

<line
  x1="330"
  y1="27"
  x2="330"
  y2="168"
  class="divider"
/>


<!-- ====================================================== -->
<!-- Total Contributions -->
<!-- ====================================================== -->

<g transform="translate(82.5, 0)">

  <text
    x="0"
    y="70"
    text-anchor="middle"
    class="big-num num-blue"
  >259</text>

  <text
    x="0"
    y="96"
    text-anchor="middle"
    class="label"
  >Total Contributions</text>

  <text
    x="0"
    y="116"
    text-anchor="middle"
    class="sub"
  >Sep 3, 2025 - Present</text>

</g>


<!-- ====================================================== -->
<!-- Current Streak -->
<!-- ====================================================== -->

<g transform="translate(247.5, 0)">

  <circle
    cx="0"
    cy="61"
    r="33"
    class="ring"
  />

  <text
    x="0"
    y="69"
    text-anchor="middle"
    class="streak-num"
  >1</text>

  <!-- Flame -->

  <path
    transform="translate(-9,23) scale(0.75)"
    fill="#39d9d9"
    d="M12 2c1 3-2 4-2 7a4 4 0 0 0 8 0c0-1-.3-2-.8-2.7C18.6 7.9 20 10 20 13a8 8 0 1 1-14.9-4C6 6 9 5 12 2z"
  />

  <text
    x="0"
    y="116"
    text-anchor="middle"
    class="streak-label"
  >Current Streak</text>

  <text
    x="0"
    y="136"
    text-anchor="middle"
    class="sub"
  >Sep 2 - Sep 2</text>

</g>


<!-- ====================================================== -->
<!-- Longest Streak -->
<!-- ====================================================== -->

<g transform="translate(412.5, 0)">

  <text
    x="0"
    y="70"
    text-anchor="middle"
    class="big-num num-blue"
  >6</text>

  <text
    x="0"
    y="96"
    text-anchor="middle"
    class="label"
  >Longest Streak</text>

  <text
    x="0"
    y="116"
    text-anchor="middle"
    class="sub"
  >Jul 30 - Aug 4</text>

</g>

</svg>
