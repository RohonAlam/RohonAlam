<svg width="560" height="200" viewBox="0 0 560 200" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Ubuntu, Sans-Serif">
  <style>
    .bg { fill: #0d1117; stroke: #2a2f3a; stroke-width: 1; }
    .divider { stroke: #2a2f3a; stroke-width: 1; }
    .big-num { font-size: 32px; font-weight: 700; }
    .num-blue { fill: #58a6ff; }
    .label { font-size: 13px; fill: #ffffff; font-weight: 600; }
    .sub { font-size: 11px; fill: #7d8590; }
    .streak-label { font-size: 13px; fill: #39d9d9; font-weight: 700; }
    .ring { fill: none; stroke: #39d9d9; stroke-width: 5; }
    .streak-num { font-size: 26px; font-weight: 700; fill: #ffffff; }
  </style>

  <rect x="1" y="1" width="558" height="198" rx="12" class="bg"/>

  <!-- dividers -->
  <line x1="186.66666666666666" y1="28" x2="186.66666666666666" y2="172" class="divider"/>
  <line x1="373.3333333333333" y1="28" x2="373.3333333333333" y2="172" class="divider"/>

  <!-- Total contributions -->
  <g transform="translate(93.33333333333333, 0)">
    <text x="0" y="72" text-anchor="middle" class="big-num num-blue">91</text>
    <text x="0" y="98" text-anchor="middle" class="label">Total Submissions</text>
    <text x="0" y="118" text-anchor="middle" class="sub">Aug 2, 2025 - Present</text>
  </g>

  <!-- Current streak -->
  <g transform="translate(280, 0)">
    <circle cx="0" cy="62" r="34" class="ring"/>
    <text x="0" y="70" text-anchor="middle" class="streak-num">3</text>
    <path transform="translate(-9,24) scale(0.75)" fill="#39d9d9" d="M12 2c1 3-2 4-2 7a4 4 0 0 0 8 0c0-1-.3-2-.8-2.7C18.6 7.9 20 10 20 13a8 8 0 1 1-14.9-4C6 6 9 5 12 2z"/>
    <text x="0" y="118" text-anchor="middle" class="streak-label">Current Streak</text>
    <text x="0" y="138" text-anchor="middle" class="sub">Jul 30 - Aug 1</text>
  </g>

  <!-- Longest streak -->
  <g transform="translate(466.6666666666667, 0)">
    <text x="0" y="72" text-anchor="middle" class="big-num num-blue">4</text>
    <text x="0" y="98" text-anchor="middle" class="label">Longest Streak</text>
    <text x="0" y="118" text-anchor="middle" class="sub">Jul 11 - Jul 14</text>
  </g>
</svg>