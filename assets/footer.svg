<!--
  footer.svg
  Sci-fi footer panel for connection status and version metadata.
  Groups: background, frame, text.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" role="img" aria-labelledby="title desc">
  <title id="title">Footer Panel</title>
  <desc id="desc">Terminal-inspired footer with status information and diagnostic line accents.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#041018" />
      <stop offset="100%" stop-color="#0D1117" />
    </linearGradient>
  </defs>
  <g id="background">
    <rect width="1200" height="220" fill="url(#panel)" />
    <rect x="18" y="18" width="1164" height="184" rx="12" fill="none" stroke="#00FFFF" stroke-opacity="0.3" />
  </g>
  <g id="frame">
    <path d="M40 60H1160" stroke="#00FFFF" stroke-opacity="0.25" />
    <path d="M40 160H1160" stroke="#00FFFF" stroke-opacity="0.25" />
    <path d="M120 40V180" stroke="#00FFFF" stroke-opacity="0.18" />
    <path d="M1080 40V180" stroke="#00FFFF" stroke-opacity="0.18" />
  </g>
  <g id="text">
    <text x="80" y="95" fill="#00FFFF" font-family="JetBrains Mono, Fira Code, monospace" font-size="22">LAST LOGIN</text>
    <text x="80" y="125" fill="#FFFFFF" font-family="JetBrains Mono, Fira Code, monospace" font-size="20">Visitor Connected</text>
    <text x="600" y="95" fill="#00FFFF" font-family="JetBrains Mono, Fira Code, monospace" font-size="22">VERSION</text>
    <text x="600" y="125" fill="#FFFFFF" font-family="JetBrains Mono, Fira Code, monospace" font-size="20">AI OS v2.0</text>
    <text x="900" y="95" fill="#00FFFF" font-family="JetBrains Mono, Fira Code, monospace" font-size="22">STATUS</text>
    <text x="900" y="125" fill="#00FF88" font-family="JetBrains Mono, Fira Code, monospace" font-size="20">READY</text>
  </g>
</svg>
