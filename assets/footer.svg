<svg width="900" height="120" viewBox="0 0 900 120" xmlns="http://www.w3.org/2000/svg">
  <!-- ============================================================
       footer.svg — sci-fi session footer
       Edit LAST_LOGIN / VERSION / STATUS text to update.
       ============================================================ -->
  <defs>
    <linearGradient id="footerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00A3FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00FFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g id="background">
    <rect x="0" y="0" width="900" height="120" fill="#0D1117" rx="12"/>
    <rect x="2" y="2" width="896" height="116" rx="10" fill="none" stroke="#00A3FF" stroke-opacity="0.35"/>
  </g>

  <g id="hud">
    <line x1="0" y1="0" x2="900" y2="0" stroke="url(#footerGrad)" stroke-width="1.5"/>
  </g>

  <g id="text" font-family="JetBrains Mono, monospace" font-size="12" fill="#8B949E">
    <text x="30" y="36" fill="#00FFFF" font-size="13" font-weight="bold">SESSION LOG</text>

    <text x="30" y="62">LAST_LOGIN</text>
    <text x="180" y="62" fill="#FFFFFF">$&#123;LAST_VISIT_TIMESTAMP&#125;</text>

    <text x="30" y="84">VISITOR</text>
    <text x="180" y="84" fill="#00FF88">Connected</text>

    <text x="480" y="62">VERSION</text>
    <text x="600" y="62" fill="#FFFFFF">AI OS v2.0</text>

    <text x="480" y="84">STATUS</text>
    <text x="600" y="84" fill="#00FF88">READY</text>

    <text x="450" y="105" text-anchor="middle" fill="#8B949E" font-size="10">
      &#8592; thanks for stopping by the workstation &#8594;
    </text>
  </g>
</svg>
