<!--
  radar.svg
  Animated radar-style element for the profile system diagnostics.
  Groups: background, radar, rings, sweep, glow.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-labelledby="title desc">
  <title id="title">Radar Scan</title>
  <desc id="desc">Animated radar scanning pattern for a cybernetic UI panel.</desc>
  <defs>
    <radialGradient id="radarFill" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00FFFF" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0" />
    </radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="scanClip"><circle cx="300" cy="300" r="240" /></clipPath>
  </defs>
  <g id="background">
    <rect width="600" height="600" fill="#0D1117" />
    <circle cx="300" cy="300" r="240" fill="url(#radarFill)" stroke="#00FFFF" stroke-opacity="0.35" />
  </g>
  <g id="radar">
    <circle cx="300" cy="300" r="220" fill="none" stroke="#00FFFF" stroke-opacity="0.25" />
    <circle cx="300" cy="300" r="160" fill="none" stroke="#00FFFF" stroke-opacity="0.20" />
    <circle cx="300" cy="300" r="100" fill="none" stroke="#00FFFF" stroke-opacity="0.18" />
    <circle cx="300" cy="300" r="40" fill="none" stroke="#00FFFF" stroke-opacity="0.18" />
    <path d="M300 300L470 130" stroke="#00FFFF" stroke-opacity="0.35" />
    <path d="M300 300L450 420" stroke="#00A3FF" stroke-opacity="0.28" />
    <path d="M300 300L210 160" stroke="#00FFFF" stroke-opacity="0.20" />
    <path d="M300 300L150 430" stroke="#00A3FF" stroke-opacity="0.24" />
  </g>
  <g id="sweep" clip-path="url(#scanClip)">
    <path d="M300 300L300 60 A240 240 0 0 1 540 300 Z" fill="#00FFFF" fill-opacity="0.10" filter="url(#glow)">
      <animateTransform attributeName="transform" type="rotate" from="0 300 300" to="360 300 300" dur="8s" repeatCount="indefinite"/>
    </path>
  </g>
  <g id="glow">
    <circle cx="300" cy="300" r="12" fill="#00FF88" opacity="0.9" filter="url(#glow)" />
  </g>
</svg>
