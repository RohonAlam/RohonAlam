<svg width="220" height="220" viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg">
  <!-- radar.svg — standalone animated radar sweep -->
  <defs>
    <radialGradient id="radarBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#05070A"/>
    </radialGradient>
  </defs>
  <g id="background">
    <circle cx="110" cy="110" r="108" fill="url(#radarBg)" stroke="#00A3FF" stroke-opacity="0.4"/>
  </g>
  <g id="hud" stroke="#00A3FF" stroke-width="1" fill="none" opacity="0.55">
    <circle cx="110" cy="110" r="80"/>
    <circle cx="110" cy="110" r="54"/>
    <circle cx="110" cy="110" r="28"/>
    <line x1="10" y1="110" x2="210" y2="110"/>
    <line x1="110" y1="10" x2="110" y2="210"/>
  </g>
  <g id="blips" fill="#00FF88">
    <circle cx="150" cy="80" r="3"><animate attributeName="opacity" values="0;1;0" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="70" cy="150" r="3"><animate attributeName="opacity" values="0;1;0" dur="3.1s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="140" cy="150" r="2.5"><animate attributeName="opacity" values="0;1;0" dur="2.8s" begin="1.1s" repeatCount="indefinite"/></circle>
  </g>
  <g id="sweep">
    <path d="M110 110 L110 30 A80 80 0 0 1 165 55 Z" fill="#00FFFF" opacity="0.28"/>
    <animateTransform attributeName="transform" attributeType="XML" type="rotate" from="0 110 110" to="360 110 110" dur="2.5s" repeatCount="indefinite"/>
  </g>
  <circle cx="110" cy="110" r="3" fill="#00FFFF"/>
</svg>
