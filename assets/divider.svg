<!--
  divider.svg
  Cyberpunk divider graphic for section separation.
  Group names: background, glow, text.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" role="img" aria-labelledby="title desc">
  <title id="title">Cyberpunk Divider</title>
  <desc id="desc">Neon divider with scan lines and HUD bars.</desc>
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00FFFF" />
      <stop offset="100%" stop-color="#00A3FF" />
    </linearGradient>
  </defs>
  <g id="background">
    <rect width="1200" height="120" fill="#0D1117" />
    <rect x="0" y="0" width="1200" height="1" fill="#00FFFF" opacity="0.5" />
    <rect x="0" y="119" width="1200" height="1" fill="#00FFFF" opacity="0.5" />
  </g>
  <g id="glow">
    <rect x="90" y="56" width="1020" height="8" rx="4" fill="url(#line)" opacity="0.75" />
    <rect x="160" y="42" width="880" height="3" fill="#00FFFF" opacity="0.5" />
    <rect x="180" y="72" width="840" height="2" fill="#00A3FF" opacity="0.5" />
  </g>
  <g id="text">
    <text x="600" y="98" text-anchor="middle" fill="#FFFFFF" font-family="JetBrains Mono, Fira Code, monospace" font-size="18" letter-spacing="4">SYSTEM TRACE</text>
  </g>
</svg>
