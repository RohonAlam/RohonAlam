<!--
  terminal.svg
  Standalone terminal frame rendered as a terminal window for use in README sections.
  Groups: background, terminal, text.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Terminal Window</title>
  <desc id="desc">Sci-fi terminal frame with command prompt and status lines.</desc>
  <defs>
    <linearGradient id="termBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#101820" />
      <stop offset="100%" stop-color="#0D1117" />
    </linearGradient>
  </defs>
  <g id="background">
    <rect width="1200" height="420" rx="16" fill="#0D1117" />
    <rect x="18" y="18" width="1164" height="384" rx="12" fill="url(#termBg)" stroke="#00FFFF" stroke-opacity="0.35" />
  </g>
  <g id="terminal">
    <rect x="38" y="38" width="1124" height="44" rx="8" fill="#111B26" stroke="#00A3FF" stroke-opacity="0.45" />
    <circle cx="72" cy="60" r="7" fill="#00FF88" />
    <circle cx="102" cy="60" r="7" fill="#00FFFF" />
    <circle cx="132" cy="60" r="7" fill="#00A3FF" />
    <text x="170" y="67" fill="#8B949E" font-family="JetBrains Mono, Fira Code, monospace" font-size="18">AI_OS://SYSTEM / COMMAND_WINDOW</text>
    <rect x="38" y="100" width="1124" height="280" rx="10" fill="#050A0E" stroke="#00FFFF" stroke-opacity="0.2" />
    <text x="68" y="145" fill="#00FFFF" font-family="JetBrains Mono, Fira Code, monospace" font-size="20">$ systemctl status telemetry</text>
    <text x="68" y="188" fill="#FFFFFF" font-family="JetBrains Mono, Fira Code, monospace" font-size="18">✓ Vision Engine: ACTIVE</text>
    <text x="68" y="220" fill="#FFFFFF" font-family="JetBrains Mono, Fira Code, monospace" font-size="18">✓ Robotics Runtime: HEALTHY</text>
    <text x="68" y="252" fill="#FFFFFF" font-family="JetBrains Mono, Fira Code, monospace" font-size="18">✓ GitHub Sync: READY</text>
    <text x="68" y="284" fill="#FFFFFF" font-family="JetBrains Mono, Fira Code, monospace" font-size="18">✓ LeetCode Knowledge Base: ACCESS GRANTED</text>
    <text x="68" y="332" fill="#00FF88" font-family="JetBrains Mono, Fira Code, monospace" font-size="20">> SYSTEM READY</text>
  </g>
</svg>
