<svg width="900" height="340" viewBox="0 0 900 340" xmlns="http://www.w3.org/2000/svg">
  <!-- ============================================================
       terminal.svg — standalone terminal window
       Fields mirror assets/config.md → IDENTITY table.
       Edit the <g id="text"> block to update values.
       ============================================================ -->
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g id="background">
    <rect x="0" y="0" width="900" height="340" rx="10" fill="#0D1117" stroke="#00A3FF" stroke-opacity="0.4"/>
  </g>

  <!-- title bar -->
  <g id="titlebar">
    <rect x="0" y="0" width="900" height="34" rx="10" fill="#161B22"/>
    <rect x="0" y="20" width="900" height="14" fill="#161B22"/>
    <circle cx="22" cy="17" r="6" fill="#FF5F56"/>
    <circle cx="44" cy="17" r="6" fill="#FFBD2E"/>
    <circle cx="66" cy="17" r="6" fill="#27C93F"/>
    <text x="450" y="21" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#8B949E">rey@ai-os: ~/system-information</text>
  </g>

  <g id="hud" stroke="#00FFFF" stroke-width="1" opacity="0.5" fill="none">
    <rect x="20" y="50" width="860" height="270" rx="6"/>
  </g>

  <g id="text" font-family="JetBrains Mono, monospace" font-size="14">
    <text x="36" y="80" fill="#00FF88">rey@ai-os:~$ whoami --full</text>

    <text x="36" y="112" fill="#8B949E">USER       </text><text x="180" y="112" fill="#FFFFFF">Rey</text>
    <text x="36" y="136" fill="#8B949E">ROLE       </text><text x="180" y="136" fill="#FFFFFF">M.Tech Student — Robotics &amp; AI</text>
    <text x="36" y="160" fill="#8B949E">INSTITUTE  </text><text x="180" y="160" fill="#FFFFFF">Indian Institute of Technology, Guwahati</text>
    <text x="36" y="184" fill="#8B949E">STATUS     </text><text x="180" y="184" fill="#00FF88" filter="url(#glow)">ONLINE — RESEARCHING</text>
    <text x="36" y="208" fill="#8B949E">MISSION    </text><text x="180" y="208" fill="#FFFFFF">3D Urban Reconstruction using Video Data</text>
    <text x="36" y="232" fill="#8B949E">LOCATION   </text><text x="180" y="232" fill="#FFFFFF">Guwahati, Assam, India</text>
    <text x="36" y="256" fill="#8B949E">UPTIME     </text><text x="180" y="256" fill="#FFFFFF">since 2025</text>
    <text x="36" y="280" fill="#8B949E">ACCESS     </text><text x="180" y="280" fill="#00FFFF">ROOT</text>

    <text x="36" y="308" fill="#00FF88">rey@ai-os:~$ <tspan fill="#FFFFFF">_</tspan></text>
    <rect x="118" y="296" width="9" height="14" fill="#00FF88">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
